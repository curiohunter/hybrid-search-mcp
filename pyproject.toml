[project]
# PyPI distribution name. "hybrid-search-mcp" is taken by an unrelated
# project (krishna1306/mcp-server-hybrid-search) — the repo, CLI command,
# and import package keep the hybrid-search name.
name = "memory-layer-mcp"
version = "0.8.0"
description = "Memory Layer MCP for Claude Code — hybrid BM25 + vector search that compounds with usage (Korean ↔ English)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "curiohunter" }]
keywords = ["mcp", "claude-code", "memory", "hybrid-search", "bm25", "vector-search", "codex"]
dependencies = [
    "mcp[cli]>=1.0",
    "tantivy>=0.22",
    "usearch>=2.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    # Phase 3b languages
    "tree-sitter-rust>=0.24",
    "tree-sitter-go>=0.25",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-swift>=0.0.1",
    "tree-sitter-kotlin>=1.0",
    "tree-sitter-css>=0.25",
    "tree-sitter-html>=0.23",
    "tree-sitter-sql>=0.3",
    "tiktoken>=0.7",
    "pathspec>=0.12",
    # Verified English stemmer for language-general qa topic matching
    # (pure Python, no transitive deps). Korean keeps its prefix rules.
    "snowballstemmer>=2.2",
]

[project.urls]
Homepage = "https://github.com/curiohunter/hybrid-search-mcp"
Repository = "https://github.com/curiohunter/hybrid-search-mcp"

[project.optional-dependencies]
gpu = []
dev = ["pytest>=8.0", "ruff>=0.4", "kiwipiepy>=0.20"]
# Korean morphological analysis for qa topic matching. Optional because the
# model is ~104MB and resident memory grows by roughly the same order —
# a real cost for an MCP server that stays running, and this package's
# pitch is a one-shot `pip install`. Without it the matcher falls back to
# josa-tolerant 2-char prefixes plus a hand list, which passes the same
# gold-set gate at slightly lower recall (35/37 vs 36/37); with it the
# prefix truncation and most of the hand list go away. Installing or
# removing it changes the tokenization, so the stored qa supersession map
# records which backend built it and is ignored (with a warning) when they
# disagree — run `reindex` after changing this.
korean = ["kiwipiepy>=0.20"]

[project.scripts]
hybrid-search-mcp = "hybrid_search.cli:main"
memory-layer-mcp = "hybrid_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_search"]

# Ship the Claude Code skills inside the wheel so a plain `pip install`
# gives the full experience — `setup` falls back to this packaged copy
# when the user didn't clone the repo.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "hybrid_search/_skills"

# The sdist otherwise ships the whole working tree. `benchmarks/` is dev
# tooling whose *outputs* quote the corpus they measured — file paths naming
# real schools, classes and internal document trees. Those quotations reached
# PyPI in 0.6.0-0.8.0 (18 such files in the 0.8.0 sdist) before anyone looked.
# Runners live in the repository for whoever clones it; measurements of
# someone's private corpus are not part of a distribution.
[tool.hatch.build.targets.sdist]
exclude = ["benchmarks", "docs/plans", "docs/handoff", ".hybrid-search"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
